    to:
      - table-features/references/column-filtering.md
      - table-features/references/global-filtering.md
      - table-features/references/grouping.md
      - table-features/references/sorting.md
      - table-features/references/expanding.md
      - table-features/references/pagination.md
    reason: Manual flags bypass the matching client row-model stages.
  - from: core/references/typescript.md
    to:
      - table-features
      - getting-started/references/create-table-hook.md
    reason: Feature and app-hook factories are the main sources of inferred v9
      userland types.
