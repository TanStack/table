open_gaps:
  - skill: 'table-features'
    question: 'Should stockFeatures be framed only as a migration/kitchen-sink
      convenience, or also as an acceptable default for small applications
      unconcerned with bundle size?'
    status: resolved
    decision: 'Explicit features are the default; stockFeatures is migration and
      kitchen-sink convenience.'
  - skill: 'client-vs-server'
    question:
      'Should mixed pipelines such as server filtering/sorting plus client
      pagination be presented neutrally, or discouraged unless all required rows
      are loaded?'
    status: resolved
    decision: 'Mixed pipelines are valid, but skills must name the owner and
      available dataset for every stage.'
  - skill: 'create-table-hook'
    question: 'Should createTableHook be recommended as the standard app-level
      abstraction once an application has multiple tables, with standalone table
      creation reserved for one-offs?'
    status: resolved
    decision: 'Recommend createTableHook for recurring app conventions and
      standalone creation for one-offs.'
  - skill: 'create-table-hook'
    question:
      'How strongly should context/injection be preferred over prop drilling
      when registered components need the table, cell, or header?'
    status: resolved
    decision:
      'Prefer the typed context or injection helpers returned by the same
      factory inside registered components.'
  - skill: 'migrate-v8-to-v9'
    question:
      'Should useLegacyTable be omitted unless it already appears in user
      code, or included as a clearly deprecated emergency bridge in a Common
      Mistakes note?'
    status: resolved
    decision: 'Mention it only when encountered and identify it as a deprecated
      temporary bridge, never the migration target.'
  - skill: 'with-tanstack-virtual'
    question:
      'Should the skills cover only the maintained examples, or also mention
      unsupported combinations such as drag-and-drop plus virtualization as
      user-owned composition?'
    status: resolved
    decision:
      'Teach maintained examples; briefly label unsupported combinations as
      user-owned composition without prescribing an unmaintained recipe.'
  - skill: 'devtools'
    question: 'Should production entrypoints be taught as supported production
      inspection, or should normal guidance keep Devtools development-only?'
    status: resolved
    decision:
      'Keep normal guidance development-only; explain production entrypoints
      only when explicitly requested.'

maintainer_interview:
  phase_2_completed: true
  phase_2_summary:
    - 'Primary journeys are first table setup, adding a feature, v8-to-v9
      migration, server-data decisions, and performance debugging.'
    - 'Table is headless and compatible with component libraries/design systems,
      but no library-specific skills are in scope.'
    - 'Feature skills should be short, edge-case-first, and route exact API
      discovery to installed dist declarations (.d.ts).'
    - 'Framework state guides, createTableHook, Query, and Virtual require
      dedicated adapter guidance where source exists.'
    - 'Worker row models are excluded and useLegacyTable must not be promoted.'
  phase_4_completed: true
  phase_4_answers_accepted: true
  progressive_disclosure_decision:
    accepted_at: 2026-10-04
    decisions:
      - Keep core state management and feature architecture directly
        discoverable.
      - Move individual optional features and adapter compositions to
        conditional references.
      - Use the official Intent artifacts-to-skills/references workflow for the
        complete batch.
disclosure_contract:
  entrypoints: 39
  feature_references: 17
  rules:
    - Every skills entry produces SKILL.md; each nested references entry
      produces the named supporting Markdown file relative to its owner.
    - Read the reviewed domain map and skill spec before updating
      skill_tree.yaml; generate files only from that tree.
    - Choose references from the requested change and relevant registrations,
      including features being added; installed or registered features alone do
      not require loading their content.
    - Use direct Markdown links with explicit read conditions; references have
      no SKILL.md frontmatter or independent discovery entry.
    - Keep source evidence and failure modes with their reference in this map,
      and aggregate sources on the owner for Intent staleness tracking.
    - Keep complete shared migration coverage in a checklist and load detailed
      mappings only when that checklist finds affected code.
    - Reference files inherit the owning skill/package version; version
      synchronization stays on SKILL.md and artifacts.
  validation:
    - Validate every declared skill and reference exists, each reference is
      directly linked from its owner, and no shipped document is absent from the
      tree.
    - Check reference Markdown and annotated snippets with the same rules as
      entry points.
    - Verify catalog size, single-file loading, reference-link resolution,
      dependency reachability, and npm package contents in a consumer fixture.
progressive_disclosure_review:
  date: 2026-10-04
  workflow: tree-generator and generate-skill Mode A from existing reviewed artifacts
  community_scan:
    - Reviewed issues 6601, 6577, 6524 and discussion 6535 for React reactive
      boundaries and inferred feature types; retained source-backed adapter
      guidance rather than unverified comment workarounds.
    - Reviewed Angular issue 6530, closed as fixed in 9.1.3; obsolete
      microtask/isMount workarounds do not belong in current skills.
    - Existing domain issue evidence and technical failure modes remain attached
      to their owning entry points or references.
  artifact_corrections:
    - Restore the aggregation inventory from its existing published skill,
      guide, and source.
    - Keep aggregationFns prerequisites tied to rowAggregationFeature.
    - Keep resize handlers tied to mouse and touch start events.
