domains:
  - slug: foundations
    name: 'Foundations and migration'
    description: 'Headless philosophy, feature registration, client/server
      ownership, TypeScript inference, API discovery, custom features, and v8
      migration.'
  - slug: feature-plugins
    name: 'Feature plugins'
    description: 'The 17 stock optional features, their prerequisites, state,
      row-model participation, and UI responsibilities.'
  - slug: framework-adapters
    name: 'Framework adapters'
    description:
      'Per-framework setup, reactive table state, v8 migration, reusable
      createTableHook patterns, and supported Query/Virtual composition.'
  - slug: observability
    name: 'Devtools'
    description: 'Framework-neutral and adapter-specific Devtools registration,
      keys, production exports, and connection failures.'
  - slug: utilities
    name: 'Utilities'
    description: 'Fuzzy ranking and comparison behavior shipped by match-sorter-utils.'

tensions:
  - name: Explicit tree-shaking vs kitchen-sink convenience
    skills:
      - core
      - table-features
      - getting-started
      - migrate-v8-to-v9
    agent_risk: Agents reach for stockFeatures or a kitchen-sink example as the
      default and silently erase the main v9 bundle-size benefit.
  - name: Client-side processing vs server-owned processing
    skills:
      - table-features/references/client-vs-server.md
      - table-features/references/column-filtering.md
      - table-features/references/global-filtering.md
      - table-features/references/grouping.md
      - table-features/references/sorting.md
      - table-features/references/pagination.md
      - getting-started/references/with-tanstack-query.md
    agent_risk: Agents enable manual flags but still expect Table row models to
      transform the data, or mix server and client stages without defining the
      boundary.
  - name: Simple whole-table subscriptions vs fine-grained reactive state
    skills:
      - table-state
      - getting-started/references/create-table-hook.md
      - getting-started/references/with-tanstack-virtual.md
    agent_risk:
      Agents either over-optimize small tables or hide state reads behind
      stable objects so framework compilers and memoization miss updates.
  - name: Reactive options vs stable model inputs
    skills:
      - core
      - table-features/references/client-vs-server.md
      - getting-started
      - table-state
      - getting-started/references/with-tanstack-query.md
    agent_risk:
      Agents derive data with map/filter/slice or recreate columns inside
      render/options callbacks, invalidating row and column models on unrelated
      updates or causing adapter render loops.
  - name: Headless flexibility vs renderer-owned correctness
    skills:
      - core
      - table-features/references/column-pinning.md
      - table-features/references/column-sizing.md
      - table-features/references/column-resizing.md
      - getting-started/references/with-tanstack-virtual.md
    agent_risk: Agents expect feature state to supply semantic markup or CSS and
      blame Table for sticky, width, accessibility, or layout behavior owned by
      their renderer.

skills:
  - slug: core
    package: '@tanstack/table-core'
    domain: foundations
    type: core
    purpose:
      Establish the headless mental model, core row model, markup ownership,
      stable inputs, and feature-driven table architecture.
    sources:
      - TanStack/table:docs/overview.md
      - TanStack/table:docs/guide/tables.md
      - TanStack/table:docs/guide/data.md
      - TanStack/table:packages/table-core/src/index.ts
      - TanStack/table:docs/guide/helpers.md
      - TanStack/table:docs/guide/column-defs.md
      - TanStack/table:docs/guide/table-and-column-meta.md
      - TanStack/table:packages/table-core/src/helpers
      - TanStack/table:packages/table-core/src/types/TableFeatures.ts
      - TanStack/table:docs/framework/react/guide/migrating.md
      - TanStack/table:docs/guide/rows.md
      - TanStack/table:packages/table-core/src/core/rows/coreRowsFeature.utils.ts
    failure_modes:
      - Treating Table as a component or design system instead of rendering
        semantic markup, styles, and accessibility in userland.
      - Recreating data or columns on every reactive pass and causing repeated
        row-model work or render loops.
      - Destructuring v9 row, cell, header, or column prototype methods and
        losing their instance this binding.
    references:
      - slug: typescript
        purpose: Preserve userland inference with columnHelper, meta helpers,
          tableOptions, and feature-derived types instead of manually threading
          generics.
        sources:
          - TanStack/table:docs/guide/helpers.md
          - TanStack/table:docs/guide/column-defs.md
          - TanStack/table:docs/guide/table-and-column-meta.md
          - TanStack/table:packages/table-core/src/helpers
        failure_modes:
          - Annotating heterogeneous helper-built columns as ColumnDef<TData,
            unknown>[] and erasing each accessor value type.
          - Manually supplying deep Table feature generics rather than deriving
            them from typeof features or letting helpers infer them.
          - Using v8 global declaration merging for per-table meta when v9
            tableMeta, columnMeta, filterMeta, and meta helpers can scope the
            types.
        path: references/typescript.md
        replaces: '@tanstack/table-core#typescript'
      - slug: api-not-found
        purpose:
          Diagnose missing exports, options, state, and instance methods before
          inventing replacement code.
        sources:
          - TanStack/table:packages/table-core/src/index.ts
          - TanStack/table:packages/table-core/src/types/TableFeatures.ts
          - TanStack/table:docs/framework/react/guide/migrating.md
        failure_modes:
          - Searching v8 docs or recalling v7 APIs instead of checking the
            installed v9 package src and exact package version.
          - Assuming an API was removed when its feature was simply omitted from
            tableFeatures.
          - Using object spread, Object.keys, or JSON serialization to discover
            v9 prototype methods and concluding those methods do not exist.
        path: references/api-not-found.md
        replaces: '@tanstack/table-core#api-not-found'
      - path: references/rows.md
        purpose: Read for display-order row numbers, row identity, or row cache misuse.
        sources:
          - TanStack/table:docs/guide/rows.md
          - TanStack/table:packages/table-core/src/core/rows/coreRowsFeature.utils.ts
        failure_modes:
          - Using row.index as the filtered, sorted display index.
          - Reading _displayIndexCache directly instead of getDisplayIndex().
    description:
      Use TanStack Table v9 core architecture, stable data and columns,
      and inferred types. Route setup, missing APIs, row models, state,
      features, and framework-specific work.
    requires: []
  - slug: table-features
    package: '@tanstack/table-core'
    domain: foundations
    type: core
    purpose: Register only the features, row-model factories, and function
      registries a table actually uses.
    sources:
      - TanStack/table:docs/guide/row-models.md
      - TanStack/table:packages/table-core/src/types/TableFeatures.ts
      - TanStack/table:packages/table-core/src/features/stockFeatures.ts
      - TanStack/table:packages/table-core/src/core/table/constructTable.ts
      - TanStack/table:packages/table-core/src/core/row-models/coreRowModelsFeature.utils.ts
      - TanStack/table:examples/react/with-tanstack-query
      - TanStack/table:docs/framework/react/guide/column-faceting.md
      - TanStack/table:packages/table-core/src/features/column-faceting
      - TanStack/table:examples/react/filters-faceted
      - TanStack/table:docs/framework/react/guide/column-filtering.md
      - TanStack/table:packages/table-core/src/features/column-filtering
      - TanStack/table:examples/react/filters
      - TanStack/table:docs/framework/react/guide/grouping.md
      - TanStack/table:packages/table-core/src/features/column-grouping
      - TanStack/table:examples/react/grouping
      - TanStack/table:docs/framework/react/guide/column-ordering.md
      - TanStack/table:packages/table-core/src/features/column-ordering
      - TanStack/table:examples/react/column-dnd
      - TanStack/table:docs/framework/react/guide/column-pinning.md
      - TanStack/table:packages/table-core/src/features/column-pinning
      - TanStack/table:examples/react/column-pinning-sticky
      - TanStack/table:docs/framework/react/guide/column-resizing.md
      - TanStack/table:packages/table-core/src/features/column-resizing
      - TanStack/table:examples/react/column-resizing-performant
      - TanStack/table:docs/framework/react/guide/column-sizing.md
      - TanStack/table:packages/table-core/src/features/column-sizing
      - TanStack/table:examples/react/column-sizing
      - TanStack/table:docs/framework/react/guide/column-visibility.md
      - TanStack/table:packages/table-core/src/features/column-visibility
      - TanStack/table:examples/react/column-visibility
      - TanStack/table:docs/framework/react/guide/global-filtering.md
      - TanStack/table:packages/table-core/src/features/global-filtering
      - TanStack/table:docs/framework/react/guide/expanding.md
      - TanStack/table:packages/table-core/src/features/row-expanding
      - TanStack/table:examples/react/expanding
      - TanStack/table:docs/framework/react/guide/pagination.md
      - TanStack/table:packages/table-core/src/features/row-pagination
      - TanStack/table:examples/react/pagination
      - TanStack/table:docs/framework/react/guide/row-pinning.md
      - TanStack/table:packages/table-core/src/features/row-pinning
      - TanStack/table:examples/react/row-pinning
      - TanStack/table:docs/framework/react/guide/cell-selection.md
      - TanStack/table:packages/table-core/src/features/cell-selection
      - TanStack/table:examples/react/cell-selection
      - TanStack/table:docs/framework/react/guide/cell-spanning.md
      - TanStack/table:packages/table-core/src/features/cell-spanning
      - TanStack/table:examples/react/cell-spanning
      - TanStack/table:docs/framework/react/guide/row-selection.md
      - TanStack/table:packages/table-core/src/features/row-selection
      - TanStack/table:examples/react/row-selection
      - TanStack/table:docs/framework/react/guide/sorting.md
      - TanStack/table:packages/table-core/src/features/row-sorting
      - TanStack/table:examples/react/sorting
      - TanStack/table:docs/framework/react/guide/aggregation.md
      - TanStack/table:packages/table-core/src/features/row-aggregation
      - TanStack/table:examples/react/aggregation
      - TanStack/table:examples/react/grouped-aggregation
    failure_modes:
      - Calling a feature API without registering its feature, so its state
        slice and runtime API do not exist.
      - Registering a row-model or function-registry slot without its
        prerequisite feature, or placing prerequisites after dependent slots.
      - Defaulting to stockFeatures for new tables and bundling every optional
        feature instead of preserving v9 tree-shaking.
    references:
      - slug: client-vs-server
        purpose:
          Choose which filtering, grouping, sorting, expanding, and pagination
          stages Table owns and which a backend owns.
        sources:
          - TanStack/table:docs/guide/row-models.md
          - TanStack/table:packages/table-core/src/core/row-models/coreRowModelsFeature.utils.ts
          - TanStack/table:examples/react/with-tanstack-query
        failure_modes:
          - Assuming manualPagination, manualSorting, manualFiltering,
            manualGrouping, or manualExpanding performs server work; each flag
            only bypasses that client row-model stage.
          - Passing a full dataset while manual pagination is enabled and
            expecting Table to slice it, or passing one page while a client row
            model expects the full dataset.
          - Mixing client and server stages without defining their order,
            producing sorting or filtering that only applies to the currently
            loaded page.
        path: references/client-vs-server.md
        replaces: '@tanstack/table-core#client-vs-server'
      - slug: column-faceting
        purpose:
          Derive filter option counts and numeric ranges from the correct faceted
          row model.
        sources:
          - TanStack/table:docs/framework/react/guide/column-faceting.md
          - TanStack/table:packages/table-core/src/features/column-faceting
          - TanStack/table:examples/react/filters-faceted
        failure_modes:
          - Registering columnFacetingFeature but omitting the facetedRowModel,
            facetedUniqueValues, or facetedMinMaxValues slot needed by the API
            being called.
          - Expecting a column facet to include that column own active filter;
            the faceted row model intentionally applies the other filters and
            excludes its own.
          - Computing large server-owned facet sets from the currently loaded
            client page and presenting incomplete counts as global results.
        path: references/column-faceting.md
        replaces: '@tanstack/table-core#column-faceting'
      - slug: column-filtering
        purpose:
          Configure column filters, filter functions, metadata, nested-row
          direction, and client/manual ownership.
        sources:
          - TanStack/table:docs/framework/react/guide/column-filtering.md
          - TanStack/table:packages/table-core/src/features/column-filtering
          - TanStack/table:examples/react/filters
        failure_modes:
          - Setting manualFiltering and still expecting createFilteredRowModel
            to transform data; manual mode returns the pre-filtered model.
          - Using accessor values that are objects or renderer output with
            built-in filter functions that expect comparable primitive values.
          - Providing controlled columnFilters plus onColumnFiltersChange
            without applying both value and updater-function forms to the
            external source.
        path: references/column-filtering.md
        replaces: '@tanstack/table-core#column-filtering'
      - slug: grouping
        purpose:
          Group rows, aggregate cells, and reason about grouped rows in expansion
          and pagination.
        sources:
          - TanStack/table:docs/framework/react/guide/grouping.md
          - TanStack/table:packages/table-core/src/features/column-grouping
          - TanStack/table:examples/react/grouping
        failure_modes:
          - Registering groupedRowModel without columnGroupingFeature,
            registering aggregationFns without rowAggregationFeature, or
            expecting grouping state alone to process rows.
          - Assuming pageSize counts only leaf data rows; group headers are rows
            in the model and affect built-in pagination.
          - Rendering every grouped cell as a normal value instead of handling
            grouped, placeholder, and aggregated cell states.
        path: references/grouping.md
        replaces: '@tanstack/table-core#grouping'
      - slug: column-ordering
        purpose:
          Control leaf-column order while respecting pinning, visibility, and
          grouped-column precedence.
        sources:
          - TanStack/table:docs/framework/react/guide/column-ordering.md
          - TanStack/table:packages/table-core/src/features/column-ordering
          - TanStack/table:examples/react/column-dnd
        failure_modes:
          - Treating columnOrder as the final rendered order while pinning
            regions and groupedColumnMode also reorder columns.
          - Using headers, labels, or array indexes as drag identifiers instead
            of stable leaf column IDs.
          - Mutating the columnOrder array in place so the state owner does not
            observe a new value.
        path: references/column-ordering.md
        replaces: '@tanstack/table-core#column-ordering'
      - slug: column-pinning
        purpose:
          Partition columns into logical start, center, and end regions and
          implement sticky layout correctly.
        sources:
          - TanStack/table:docs/framework/react/guide/column-pinning.md
          - TanStack/table:packages/table-core/src/features/column-pinning
          - TanStack/table:examples/react/column-pinning-sticky
        failure_modes:
          - Using v8 or early-beta left/right state and APIs instead of v9
            logical start/end names, especially in RTL layouts.
          - 'Expecting pinning state to apply position: sticky, offsets,
            z-index, backgrounds, or overflow CSS automatically.'
          - Allowing rendered widths to diverge from column.getSize, producing
            gaps or overlaps between adjacent pinned columns.
        path: references/column-pinning.md
        replaces: '@tanstack/table-core#column-pinning'
      - slug: column-resizing
        purpose:
          Wire resize gestures and resize state onto the numeric sizing model
          without avoidable render cost.
        sources:
          - TanStack/table:docs/framework/react/guide/column-resizing.md
