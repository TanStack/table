  - from: table-features/references/grouping.md
    to:
      - table-features/references/expanding.md
      - table-features/references/pagination.md
    reason: Grouped rows are expanded row trees and count as rows during pagination.
  - from: table-features/references/column-pinning.md
    to:
      - table-features/references/column-sizing.md
      - table-features/references/column-resizing.md
