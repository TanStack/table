issue_evidence:
  - cluster: 'Feature and API discovery'
    references: ['discussion/5834', 'issue/6212', 'issue/6311']
    finding: 'V9 modularity, renamed registries, and type-gated APIs make
      installed-source lookup and feature registration essential.'
  - cluster: 'Composable tables and context'
    references: ['issue/6348', 'issue/6323', 'issue/6199', 'issue/2344']
    finding:
      'Circular imports, context identity, and remount/stale-input failures
      require dedicated createTableHook references linked from each adapter
      entry point.'
  - cluster: 'Framework state and compiler reactivity'
    references:
      ['issue/6224', 'issue/6236', 'issue/6374', 'issue/6117', 'issue/5903']
    finding: 'Snapshot reads, controlled updater semantics, auto resets, and
      compiler-hidden method reads are recurring silent failures.'
  - cluster: 'Manual row models'
    references:
      [
        'issue/4917',
        'issue/5110',
        'issue/4771',
        'issue/5850',
        'discussion/3552',
        'discussion/5137',
      ]
    finding:
      'Users routinely expect manual flags to process rows or assume off-page
      rows remain available as Row objects.'
  - cluster: 'TypeScript inference'
    references:
      [
        'issue/4241',
        'issue/4382',
        'issue/4387',
        'discussion/4195',
        'discussion/4220',
      ]
    finding:
      'Manual ColumnDef annotations and deep generics erase TValue inference
      or overload TypeScript; v9 helpers should lead.'
  - cluster: 'Renderer-owned layout'
    references:
      [
        'issue/5783',
        'issue/5986',
        'discussion/4179',
        'discussion/4439',
        'discussion/3259',
      ]
    finding: 'Pinning, width, alignment, RTL, and responsive behavior require
      explicit renderer CSS and stable sizing inputs.'

