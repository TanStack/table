library:
  name: '@tanstack/table'
  version: '9.2.6'
  repository: 'https://github.com/TanStack/table'
  homepage: 'https://tanstack.com/table'
  description: 'Headless, framework-agnostic data-grid state and row-processing
    primitives with tree-shakeable v9 features and framework adapters.'
  primary_framework: 'framework-agnostic'
  monorepo: true
  package_version_overrides:
    '@tanstack/preact-table-devtools': '9.2.5'
    '@tanstack/react-table-devtools': '9.2.5'
    '@tanstack/solid-table-devtools': '9.2.5'
    '@tanstack/table-devtools': '9.2.5'
    '@tanstack/vue-table-devtools': '9.2.5'

meta:
  generated_by: '@tanstack/intent scaffold domain discovery'
  date: '2026-08-01'
  status: reviewed
  maintainer_review_pending: false
  phase_4_date: '2026-07-10'
  release_voice:
    'Treat v9 as stable guidance while recording the exact prerelease
    package version in skill metadata.'
  structure_updated_at: 2026-10-04
  structure_workflow: Existing reviewed domain map and maintainer-approved
    progressive-disclosure proposal -> revised skill spec -> skill tree ->
    generate-skill Mode A.

scope:
  goals:
    - 'Route agents to the correct package and skill, then correct common
      foot-guns and misconceptions.'
    - 'Use docs and examples for intended workflows, and direct exact API
      discovery to installed package declarations (dist/**/*.d.ts).'
    - 'Teach headless rendering, feature registration, row-model ownership,
      framework state, and v8-to-v9 changes as foundations.'
  included:
    - 'All 18 public workspace packages.'
    - 'All 17 stock Table v9 features, custom features, TypeScript helpers,
      migrations, framework state, composable table hooks, Query, Virtual,
      Devtools, and fuzzy ranking.'
    - 'Renderer-owned CSS edge cases for sticky positioning, column widths,
      resizing, layout, and virtualization.'
  excluded:
    - 'Component-library-specific integrations such as shadcn, Material UI,
      Mantine, and equivalent design systems.'
    - 'Worker row models and experimental worker guidance.'
    - 'A dedicated performance skill; performance guidance is placed where the
      relevant state, row model, or virtualization decision is made.'
    - 'A promoted useLegacyTable workflow; it may only be identified as a
      deprecated temporary stopgap when encountered.'

validation_contract:
  - 'Every generated skill must pass Intent validation and exact package-version
    synchronization.'
  - 'Load-bearing TypeScript examples marked with skill-snippet:check must
    compile against workspace source and their package tsconfig.'
  - 'Content checks reject malformed Markdown tables, invented package imports,
    feature-gated APIs without their feature, unstable empty-array data getters,
    and adapter-specific corrected foot-guns.'
  - 'Wrong/Correct pairs are reserved for code where Wrong actually misbehaves;
    valid defaults and supported alternatives must use decision-oriented prose
    instead.'
  - 'Virtual integration patterns must follow the maintained adapter
    guide/example rather than borrowing another framework adapter API.'
  - 'Release automation updates skill and artifact version metadata after
    package versions are calculated and before packages publish.'

migration_depth_contract:
  exception: 'Keep the exhaustive shared audit checklist in the core migration
    skill and detailed mappings in its references. Adapter migration skills
    explicitly load that checklist and add adapter-only checks and references;
    preserve every breaking change without repeating shared inventories.'
  required_coverage:
    - 'Framework package and construction entrypoint changes, including
      framework-version prerequisites.'
    - 'Logical start/end column-pinning rename and the full old-to-new API
      mapping.'
    - 'Prototype-bound row, cell, column, and header methods;
      object-spread/Object.keys/JSON implications.'
    - 'Required tableFeatures registration, stockFeatures audit guidance, all 17
      feature imports, and feature-gated state/APIs.'
    - 'Core row model removal plus every get*RowModel to create*RowModel
      feature-slot mapping.'
    - 'filterFns, sortFns, aggregationFns, and filterMeta registry-slot
      migration.'
    - 'Adapter state access, selectors/subscriptions, controlled slices,
      external atoms, precedence, and onStateChange removal.'
    - 'createColumnHelper TFeatures and columns() inference changes.'
    - 'Framework rendering helper/component/directive changes.'
    - 'tableOptions and createTableHook composability.'
    - 'enablePinning split, columnSizing/columnResizing split and state/API
      renames.'
    - 'Sorting option/API/type/built-in registry renames.'
    - 'Removed underscore-prefixed internal APIs and public row API
      replacements.'
    - 'Row-selection some-selected semantic changes and correct indeterminate
      checks.'
    - 'TFeatures generic changes, StockFeatures typing, meta typing,
      function-registry augmentation replacement, and RowData restriction.'
    - 'A final exhaustive migration checklist suitable for auditing an existing
      codebase.'

table_state_depth_contract:
  exception: 'Shared ownership and reset rules belong to the core table-state
    skill. Adapter table-state skills require it and retain essential reactive
    reads and controlled wiring inline, with advanced patterns in references.
    State repair does not require getting-started.'
  required_coverage:
    - 'Table as a state coordinator and internal state as the default ownership
      choice.'
    - 'Feature-gated state slices and the relationship between registered
      features, options, APIs, atoms, and inferred types.'
    - 'The distinct baseAtoms, atoms, store, and adapter-selected state
      surfaces.'
    - 'Current snapshot reads versus framework-reactive subscriptions or tracked
      reads.'
    - 'Exactly one owner per slice: internal state, initialState, external
      atoms, or state plus on[State]Change.'
    - 'External-atom precedence, controlled-state synchronization,
      updater-function handling, and global onStateChange removal.'
    - 'Feature methods as the preferred write surface, baseAtoms as a low-level
      escape hatch, and external-atom writes when externally owned.'
    - 'initialState timing, feature reset behavior, reset-to-default arguments,
      and core reset limitations with external atoms.'
    - 'Feature-specific state types and TableState<typeof features> inference.'
    - 'Adapter-specific selectors, subscriptions, compiler/reactivity
      boundaries, and option synchronization.'

stable_model_input_contract:
  rule:
    'Every skill example must keep data and columns references stable between
    meaningful changes. Never recommend inline map/filter/slice chains,
    makeColumns calls, or fresh fallback arrays in repeatedly evaluated table
    options.'
  accepted_patterns:
    - 'Module or component-lifetime constants for static data and columns.'
    - 'Framework memo/computed primitives for derived data, keyed to the actual
      derivation inputs.'
    - 'Stable state, signal, ref, rune, resource, or Query result references for
      changing data.'
    - 'A module-level stable empty fallback instead of data ?? [] in React-like
      render paths or reactive option initializers.'

custom_feature_depth_contract:
  exception:
    'Keep the custom-feature workflow directly discoverable. Preserve the
    complete extension surface and annotated authoritative example in
    references/plugin-example.md, linked before implementation.'
  required_feature_maps:
    - 'TableState_FeatureMap'
    - 'TableOptions_FeatureMap<TFeatures, TData>'
    - 'Table_FeatureMap<TFeatures, TData>'
    - 'ColumnDef_FeatureMap<TFeatures, TData, TValue>'
    - 'Column_FeatureMap<TFeatures, TData>'
    - 'Row_FeatureMap<TFeatures, TData>'
    - 'Cell_FeatureMap'
    - 'Header_FeatureMap'
    - 'RowModelFns_FeatureMap<TFeatures, TData>'
    - 'CachedRowModels_FeatureMap<TFeatures, TData>'
  required_api_installation:
    - 'assignTableAPIs inside constructTableAPIs for the singleton table.'
    - 'assignPrototypeAPIs inside assignColumnPrototype for shared column
      methods.'
    - 'assignPrototypeAPIs inside assignRowPrototype for shared row methods.'
    - 'assignPrototypeAPIs inside assignCellPrototype for shared cell methods.'
    - 'assignPrototypeAPIs inside assignHeaderPrototype for shared header
      methods.'
    - 'initColumnInstanceData and initRowInstanceData for per-instance mutable
      data rather than shared methods.'
    - 'The table_/column_/row_/cell_/header_ static-name prefixes, self argument
      difference, optional memoDeps, and absence of per-object assign*APIs
      utilities.'

api_discovery_policy:
  rule:
    'For exact exports, option types, state shapes, and instance APIs, inspect
    dist declarations (.d.ts) in the installed package before inventing an API
    or relying on memory.'
  adapter_entrypoint: 'node_modules/@tanstack/<framework>-table/dist/index.d.ts'
  core_entrypoint: 'node_modules/@tanstack/table-core/dist/index.d.ts'
  feature_source: 'node_modules/@tanstack/table-core/dist/features/<feature>/'
  ember_entrypoint: 'node_modules/@tanstack/ember-table/declarations/index.d.ts'
  angular_entrypoint: 'node_modules/@tanstack/angular-table/dist/types/'
  octane_entrypoint: 'node_modules/@tanstack/octane-table/src/index.d.ts'
  fallback: 'If declarations are unavailable, resolve the installed package root
    and inspect published types; do not open package src/ or substitute v8 /
    another adapter API.'

