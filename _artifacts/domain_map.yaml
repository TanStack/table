        failure_modes:
          - Registering columnResizingFeature without its columnSizingFeature
            prerequisite.
          - Displaying a resize handle without attaching header.getResizeHandler
            to mouse and touch start events.
          - Reading getSize repeatedly in every cell during onChange resizing
            instead of caching sizes or using CSS variables for large tables.
        path: references/column-resizing.md
        replaces: '@tanstack/table-core#column-resizing'
      - slug: column-sizing
        purpose: Use numeric min, max, and current sizes as state inputs to a
          renderer-owned CSS layout.
        sources:
          - TanStack/table:docs/framework/react/guide/column-sizing.md
          - TanStack/table:packages/table-core/src/features/column-sizing
          - TanStack/table:examples/react/column-sizing
        failure_modes:
          - Expecting the numeric sizing state to set DOM widths without
            applying it to th/td descendants, grid tracks, or flex styles.
          - Forcing auto or percentage strings through a number API instead of
            choosing and implementing an appropriate CSS layout strategy.
          - Forgetting the default size and rendered content can disagree, which
            also corrupts pinning offsets and total-size calculations.
        path: references/column-sizing.md
        replaces: '@tanstack/table-core#column-sizing'
      - slug: column-visibility
        purpose:
          Hide leaf columns while rendering only visibility-aware header, column,
          and cell collections.
        sources:
          - TanStack/table:docs/framework/react/guide/column-visibility.md
          - TanStack/table:packages/table-core/src/features/column-visibility
          - TanStack/table:examples/react/column-visibility
        failure_modes:
          - Updating columnVisibility but rendering getAllLeafColumns or
            row.getAllCells, so hidden columns remain in the DOM.
          - Treating absent map entries as hidden; only an explicit false hides
            a column.
          - Expecting enableHiding to hide a column when it only controls
            whether the user or API may hide it.
        path: references/column-visibility.md
        replaces: '@tanstack/table-core#column-visibility'
      - slug: global-filtering
        purpose: Apply one filter across eligible columns with explicit column
          eligibility and client/manual ownership.
        sources:
          - TanStack/table:docs/framework/react/guide/global-filtering.md
          - TanStack/table:packages/table-core/src/features/global-filtering
          - TanStack/table:examples/react/filters
        failure_modes:
          - Registering globalFilteringFeature without columnFilteringFeature
            and a filtered row-model stage when client processing is expected.
          - Assuming every column participates; the default eligibility checks
            the first core row value and only accepts strings or numbers.
          - Using manualFiltering while updating globalFilter state but never
            sending that value to the server query.
        path: references/global-filtering.md
        replaces: '@tanstack/table-core#global-filtering'
      - slug: expanding
        purpose:
          Expand hierarchical subrows or custom detail panels and place expansion
          correctly relative to pagination.
        sources:
          - TanStack/table:docs/framework/react/guide/expanding.md
          - TanStack/table:packages/table-core/src/features/row-expanding
          - TanStack/table:examples/react/expanding
        failure_modes:
          - Expecting nested data to expand without getSubRows, or expecting a
            custom detail panel without getRowCanExpand and renderer markup.
          - Updating expanded state but never rendering subrows or the custom
            expanded UI because Table is headless.
          - Assuming paginateExpandedRows changes grouping or flattens visual
            descendants; it only controls the expanded-row pagination stage.
        path: references/expanding.md
        replaces: '@tanstack/table-core#expanding'
      - slug: pagination
        purpose:
          Configure client slicing or manual pages, counts, navigation limits,
          and automatic page-index resets.
        sources:
          - TanStack/table:docs/framework/react/guide/pagination.md
          - TanStack/table:packages/table-core/src/features/row-pagination
          - TanStack/table:examples/react/pagination
        failure_modes:
          - Enabling manualPagination and passing all rows while expecting Table
            to slice them; manual data must already represent the intended page.
          - Omitting rowCount or pageCount for server pagination and then
            trusting next-page or last-page availability.
          - Misdiagnosing pageIndex jumping to zero as failed controlled state
            when autoResetPageIndex is reacting to client-side data or row-model
            changes.
        path: references/pagination.md
        replaces: '@tanstack/table-core#pagination'
      - slug: row-pinning
        purpose:
          Separate top, center, and bottom rows with stable IDs and explicit
          rendering/sticky behavior.
        sources:
          - TanStack/table:docs/framework/react/guide/row-pinning.md
          - TanStack/table:packages/table-core/src/features/row-pinning
          - TanStack/table:examples/react/row-pinning
        failure_modes:
          - Using index-derived row IDs for persistent pinning while sorting,
            filtering, pagination, or data insertion changes indexes.
          - Expecting row pinning to add sticky CSS or render top/center/bottom
            collections in the correct order automatically.
          - Ignoring keepPinnedRows, so pinned rows remain visible outside the
            center row model when the desired product behavior was to filter or
            paginate them away.
        path: references/row-pinning.md
        replaces: '@tanstack/table-core#row-pinning'
      - slug: cell-selection
        purpose: Maintain spreadsheet-style rectangular selections as ordered
          include/exclude operations anchored to row and column ids, resolving
          them into disjoint positive regions across sorting, filtering,
          pagination, and column layout changes.
        sources:
          - TanStack/table:docs/framework/react/guide/cell-selection.md
          - TanStack/table:packages/table-core/src/features/cell-selection
          - TanStack/table:examples/react/cell-selection
        failure_modes:
          - Expecting cellSelection to be a per-cell map or a list of final
            positive regions; it is an ordered log of two-corner include/exclude
            operations, and derived bounds may split one stored range into
            several regions.
          - Reordering, deduplicating, or serializing only the corners of
            controlled cellSelection state and thereby changing or losing
            subtraction semantics.
          - Using additive when the intended operation is explicit subtraction;
            selectCellRange mode is replace, include, or exclude, while additive
            is only a deprecated include alias.
          - Assuming Ctrl/Cmd always adds a range; a modified interaction
            excludes when it starts on a selected cell and includes when it
            starts on an unselected cell.
          - Binding only the mousedown handler and expecting drag selection, or
            reimplementing mouseup even though the start handler owns its own
            document listener.
          - Drawing the selection outline with borders on a border-collapse
            table, which changes row heights as cells become selected.
          - Re-rendering every cell on each drag update instead of subscribing
            per row to table.atoms.cellSelection.
        path: references/cell-selection.md
        replaces: '@tanstack/table-core#cell-selection'
      - slug: cell-spanning
        purpose:
          Merge adjacent body cells into row- and column-spanning cells derived
          from the rendered row model, with covered cells reporting a span of 0
          that renderers must skip.
        sources:
          - TanStack/table:docs/framework/react/guide/cell-spanning.md
          - TanStack/table:packages/table-core/src/features/cell-spanning
          - TanStack/table:examples/react/cell-spanning
        failure_modes:
          - Rendering a covered cell with rowSpan={0} instead of skipping it;
            HTML rowspan="0" means span to the end of the row group, so the cell
            merges down the entire tbody.
          - Expecting spanning to sort or group rows; it merges adjacent equal
            values only, so unsorted data renders no merges at all.
          - Precomputing spans from the source data array, which survives
            sorting, filtering, and page changes and produces ragged rows.
          - Assuming a run continues across a page or pinned-section boundary;
            runs are clipped to the rendered rows of each section.
          - Pre-expanding stored selection corners to cover merges; selection
            bounds already expand at derivation time when both features are
            registered, and pre-expanded corners go stale when sorting or paging
            changes the merges.
        path: references/cell-spanning.md
        replaces: '@tanstack/table-core#cell-spanning'
      - slug: row-selection
        purpose:
          Maintain selection IDs across current, filtered, grouped, and manually
          paginated data.
        sources:
          - TanStack/table:docs/framework/react/guide/row-selection.md
          - TanStack/table:packages/table-core/src/features/row-selection
          - TanStack/table:examples/react/row-selection
        failure_modes:
          - Assuming selection mutates application data or is automatically
            deleted when rows disappear; rowSelection is independent ID state.
          - Using default index IDs for server pagination or mutable data
            instead of a stable getRowId.
          - Treating getSelectedRowModel as a database-wide selection lookup
            under manual pagination even though only loaded rows can appear in a
            row model.
        path: references/row-selection.md
        replaces: '@tanstack/table-core#row-selection'
      - slug: sorting
        purpose: Configure single/multi sorting, comparison functions, undefined
          placement, removal cycles, and client/manual ownership.
        sources:
          - TanStack/table:docs/framework/react/guide/sorting.md
          - TanStack/table:packages/table-core/src/features/row-sorting
          - TanStack/table:examples/react/sorting
        failure_modes:
          - Setting manualSorting and expecting createSortedRowModel to reorder
            rows; manual mode trusts incoming data.
          - Writing a custom sortFn that applies ascending/descending direction
            itself even though Table reverses the comparator result for
            descending order.
          - Assuming undefined values, multi-sort gestures, and sort-removal
            cycles match product expectations without configuring sortUndefined
            and multi-sort options.
        path: references/sorting.md
        replaces: '@tanstack/table-core#sorting'
      - slug: aggregation
        path: references/aggregation.md
        replaces: '@tanstack/table-core#aggregation'
        purpose:
          Aggregate columns independently of grouping, with depth-selected row
          scopes, multiple keyed aggregations, custom context definitions, and
          manual values.
        sources:
          - TanStack/table:docs/framework/react/guide/aggregation.md
          - TanStack/table:packages/table-core/src/features/row-aggregation
          - TanStack/table:examples/react/aggregation
          - TanStack/table:examples/react/grouped-aggregation
        failure_modes:
          - Adding grouping solely to compute a grand total instead of using
            rowAggregationFeature.
          - Passing a nonexistent scope option alongside rows; the public
            options contain rows and maxDepth.
          - Using the legacy callable aggregation signature instead of
            constructAggregationFn and the aggregate context.
          - Registering aggregationFns without rowAggregationFeature or assuming
            grouping state alone computes aggregates.
    description: 'Add or debug Table v9 features: registration, row-model slots,
