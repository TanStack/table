<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TanStack Alpine Table - Basic Dynamic Columns</title>
  </head>
  <body>
    <div id="root" class="demo-root" x-data="table">
      <p class="demo-note">
        Columns, sort fns, filter fns, and filter components are all derived
        from the data type of each field, not from a hard-coded column
        definition.
      </p>
      <div class="button-row">
        <button class="demo-button demo-button-sm" @click="refreshData()">
          Regenerate Data
        </button>
        <button class="demo-button demo-button-sm" @click="stressTest()">
          Stress Test (1M rows)
        </button>
      </div>
      <div class="spacer-sm"></div>
      <div class="scroll-container">
        <table>
          <thead>
            <template
              x-for="headerGroup in table.getHeaderGroups()"
              :key="headerGroup.id"
            >
              <tr>
                <template
                  x-for="header in headerGroup.headers"
                  :key="header.id"
                >
                  <th :colspan="header.colSpan">
                    <template x-if="!header.isPlaceholder">
                      <div>
                        <div
                          :class="header.column.getCanSort() ? 'sortable-header' : ''"
                          :title="header.column.getCanSort() ? 'Toggle sorting' : ''"
                          @click="header.column.getCanSort() && toggleSort(header.column)"
                        >
                          <span x-html="FlexRender({ header })"></span
                          ><span x-text="sortIndicator(header.column)"></span>
                        </div>
                        <template x-if="header.column.getCanFilter()">
                          <div>
                            <!-- number: two faceted min/max range inputs -->
                            <template
                              x-if="dataType(header.column) === 'number'"
                            >
                              <div class="filter-row">
                                <input
                                  type="number"
                                  class="filter-input"
                                  :value="rangeValue(header.column, 0)"
                                  @input="onRangeMin(header.column, $event.target.value)"
                                  :placeholder="'Min' + (facetMin(header.column) !== '' ? ' (' + facetMin(header.column) + ')' : '')"
                                />
                                <input
                                  type="number"
                                  class="filter-input"
                                  :value="rangeValue(header.column, 1)"
                                  @input="onRangeMax(header.column, $event.target.value)"
                                  :placeholder="'Max' + (facetMax(header.column) !== '' ? ' (' + facetMax(header.column) + ')' : '')"
                                />
                              </div>
                            </template>
                            <!-- date: two date inputs -->
                            <template x-if="dataType(header.column) === 'date'">
                              <div class="filter-row">
                                <input
                                  type="date"
                                  class="filter-input"
                                  :value="dateValue(header.column, 0)"
                                  @input="onDateMin(header.column, $event.target.value)"
                                />
                                <input
                                  type="date"
                                  class="filter-input"
                                  :value="dateValue(header.column, 1)"
                                  @input="onDateMax(header.column, $event.target.value)"
                                />
                              </div>
                            </template>
                            <!-- boolean: All / Yes / No select -->
                            <template
                              x-if="dataType(header.column) === 'boolean'"
                            >
                              <select
                                class="filter-select"
                                :value="booleanValue(header.column)"
                                @change="onBooleanFilter(header.column, $event.target.value)"
                              >
                                <option value="">All</option>
                                <option value="true">Yes</option>
                                <option value="false">No</option>
                              </select>
                            </template>
                            <!-- string enum: select of faceted values -->
                            <template
                              x-if="dataType(header.column) === 'string' && isEnum(header.column)"
                            >
                              <select
                                class="filter-select"
                                :value="enumValue(header.column)"
                                @change="onEnumFilter(header.column, $event.target.value)"
                              >
                                <option value="">All</option>
                                <template
                                  x-for="value in uniqueValues(header.column)"
                                  :key="value"
                                >
                                  <option
                                    :value="value"
                                    x-text="value"
                                  ></option>
                                </template>
                              </select>
                            </template>
                            <!-- string (high cardinality): debounced text + datalist -->
                            <template
                              x-if="dataType(header.column) === 'string' && !isEnum(header.column)"
                            >
                              <div>
                                <datalist :id="header.column.id + 'list'">
                                  <template
                                    x-for="value in uniqueValues(header.column)"
                                    :key="value"
                                  >
                                    <option :value="value"></option>
                                  </template>
                                </datalist>
                                <input
                                  type="text"
                                  class="filter-input"
                                  style="width: 9rem"
                                  :list="header.column.id + 'list'"
                                  :value="header.column.getFilterValue() ?? ''"
                                  @input="onTextFilter(header.column, $event.target.value)"
                                  :placeholder="'Search... (' + uniqueCount(header.column) + ')'"
                                />
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </th>
                </template>
              </tr>
            </template>
          </thead>
          <tbody>
            <template
              x-for="row in table.getRowModel().rows.slice(0, 15)"
              :key="row.id"
            >
              <tr>
                <template x-for="cell in row.getAllCells()" :key="cell.id">
                  <td x-html="FlexRender({ cell })"></td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <div class="spacer-sm"></div>
      <div>
        <span x-text="table.getRowModel().rows.length.toLocaleString()"></span>
        Rows
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
