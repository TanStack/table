<aside class="configurator" aria-label="Benchmark configurator">
  <header>
    <span>CONFIGURATOR</span>
    <small>RUN PARAMETERS</small>
  </header>

  <section class="config-section" aria-labelledby="adapter-settings">
    <h2 id="adapter-settings">TABLE ADAPTER</h2>
    <label class="field">
      <span>Implementation</span>
      <select
        data-testid="adapter-select"
        [value]="controller.tableAdapter()"
        (change)="setTableAdapter($event)"
      >
        <option value="local">Local optimized (v9)</option>
        <option value="beta">Published 9.0.0-beta.80</option>
        <option value="v8">Published 8.21.4</option>
      </select>
      <small>Switching destroys the active table and mounts the selected adapter.</small>
    </label>
  </section>

  <section class="config-section" aria-labelledby="feed-settings">
    <h2 id="feed-settings">FEED</h2>
    <button
      class="primary-action"
      type="button"
      data-testid="feed-toggle"
      (click)="controller.toggleFeed()"
    >
      {{ controller.running() ? 'PAUSE FEED' : 'START FEED' }}
    </button>

    <label class="field">
      <span>Instruments</span>
      <select
        data-testid="instrument-count-select"
        [value]="controller.instrumentCount()"
        (change)="setRowCount($event)"
      >
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="150">150</option>
        <option value="250">250</option>
        <option value="350">350</option>
        <option value="500">500</option>
        <option value="750">750</option>
        <option value="1000">1,000</option>
      </select>
    </label>

    <label class="field">
      <span>Load profile</span>
      <select
        data-testid="load-profile-select"
        [value]="controller.feedLoadProfile()"
        (change)="setFeedLoadProfile($event)"
      >
        <option value="low">Low · 1K/s</option>
        <option value="medium">Medium · 5K/s</option>
        <option value="high">High · 10K/s</option>
        <option value="very-high">Very high · 25K/s</option>
        <option value="max">Max · 100K/s</option>
        <option value="custom">Custom</option>
      </select>
      <small>High is the repeatable default; Max is intentionally saturating.</small>
    </label>

    <label class="field rate-field">
      <span>
        Target event rate
        <strong>{{ formatRate(controller.targetEventsPerSecond()) }}/s</strong>
      </span>
      <input
        data-testid="target-rate-slider"
        type="range"
        min="100"
        max="100000"
        step="100"
        [value]="controller.targetEventsPerSecond()"
        (input)="setTargetRate($event)"
      />
      <small>100 — 100,000 events/s</small>
    </label>
  </section>

  <section class="config-section" aria-labelledby="render-settings">
    <h2 id="render-settings">RENDER PATH</h2>
    <label class="field">
      <span>Row workload</span>
      <select
        data-testid="row-workload-select"
        [value]="controller.rowWorkloadMode()"
        (change)="setRowWorkloadMode($event)"
      >
        <option value="stable">Stable universe</option>
        <option value="price-sort">Continuously sort by Last</option>
        <option value="rotating-filter">Rotate 20% filtered rows</option>
        <option value="identity-churn">Replace 10% of ticker IDs</option>
      </select>
      <small>
        Reorder preserves IDs; filter removes/reinserts rows; replacement forces
        new row identities.
      </small>
    </label>

    <label class="toggle-field">
      <input
        data-testid="table-worker-toggle"
        type="checkbox"
        [disabled]="controller.tableAdapter() !== 'local'"
        [checked]="controller.tableWorkerEnabled()"
        (change)="setTableWorkerEnabled($event)"
      />
      <span>
        Worker row model (v9 only)
        <small>offloads the filtered row-model stage to a dedicated worker</small>
      </span>
    </label>

    <label class="toggle-field">
      <input
        type="checkbox"
        [checked]="controller.rendererMode() === 'swap'"
        (change)="setRendererMode($event)"
      />
      <span>
        Swap Tick component A ↔ B
        <small>destroy and recreate when direction changes</small>
      </span>
    </label>

    <label class="toggle-field">
      <input
        type="checkbox"
        [checked]="controller.updateSparklines()"
        (change)="setSparklineUpdates($event)"
      />
      <span>
        Update sparklines
        <small>new history input every four quote events</small>
      </span>
    </label>

    <label class="toggle-field">
      <input
        type="checkbox"
        [checked]="controller.updateQuoteAges()"
        (change)="setQuoteAgeUpdates($event)"
      />
      <span>
        Update quote age clock
        <small>invalidates every Age cell on a shared 100 ms clock</small>
      </span>
    </label>
  </section>

  <section class="config-section" aria-labelledby="stress-actions">
    <h2 id="stress-actions">STRESS ACTIONS</h2>
    <div class="action-grid">
      <button type="button" (click)="controller.runBurst()">RUN 25K BURST</button>
      <button type="button" (click)="controller.resetMarket()">RESET SESSION</button>
    </div>
  </section>

  <app-diagnostics />
  <app-selected-instrument />
</aside>
